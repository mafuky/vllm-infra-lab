# k3s 镜像加速配置：setup-node.sh 会把它复制到 /etc/rancher/k3s/registries.yaml
#
# ── 为什么要有它 ──────────────────────────────────────────────
#
# 服务器在国内，直连 docker.io、ghcr.io、nvcr.io 拉镜像经常超时，
# Pod 会卡在 ImagePullBackOff，看起来像配置错了，其实只是网络。
# 这里给三个仓库都配上国内公共镜像站，按顺序尝试，都失败时 containerd 会回退到原站。
# 2026-10-14 在优云智算华北二A实测：DaoCloud 的 docker.io 和 ghcr.io 镜像能连上但不出数据，拉取卡死；
# dockerproxy.net 和南京大学的 ghcr.nju.edu.cn 可以匿名拉，放在最前面。nvcr.io 走 DaoCloud 正常。
# 公共镜像站随时可能限流或下线，Pod 卡在 ContainerCreating 很久时，先用 sudo k3s ctr -n k8s.io content active
# 看层的大小在不在涨，不涨就是镜像站的问题。
#
# 改了这个文件要 sudo systemctl restart k3s 才生效。
mirrors:
  docker.io:
    endpoint:
      - "https://dockerproxy.net"
      - "https://docker.m.daocloud.io"
      - "https://registry-1.docker.io"
  ghcr.io:
    endpoint:
      - "https://ghcr.nju.edu.cn"
      - "https://ghcr.m.daocloud.io"
      - "https://ghcr.io"
  nvcr.io:
    endpoint:
      - "https://nvcr.m.daocloud.io"
      - "https://nvcr.io"
